<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Food Ordering</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Food Ordering</h1>
    <p>Order your favorite dishes online</p>
  </header>

  <!-- Nav links point to the renamed pages -->
  <nav>
    <a href="Ordering_page.html">Order</a>
    <a href="Order_tracking.html">Track Order</a>
    <a href="Admin.html">Admin</a>
  </nav>

  <main>
    <input type="text" id="searchBox" placeholder="Search for a dish...">

    <section class="menu-grid" id="menuGrid">
      <!-- Dish cards are injected here by JS -->
    </section>

    <section id="cart">
      <h2>Your Cart</h2>
      <ul id="cartList"></ul>
      <p id="total">Total: 0 VND</p>
    </section>

    <form id="orderForm">
      <h2>Order Details</h2>
      <label for="customerName">Customer Name</label>
      <input type="text" id="customerName" required>

      <label for="tableNumber">Table Number (optional)</label>
      <input type="text" id="tableNumber">

      <button type="submit">Place Order</button>
      <div id="orderMessage"></div>
    </form>
  </main>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
